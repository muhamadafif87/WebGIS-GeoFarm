<div class="popup-signup" id="popup-signup">
    <div class="text-title">Sign Up</div>
    <form class="form-signup" id="form-signup">
        <div class="col-md-6 mb-3">
            <input type="text" name="nama" class="form-control" placeholder="Nama anda" required>
        </div>
        <div class="col-md-6 mb-3">
            <input type="text" name="Nomor_Telepon" class="form-control" placeholder="No Telepon" required>
        </div>
        <div class="col-md-6 mb-3">
            <input type="text" name="email" class="form-control" placeholder="E-mail" required>
        </div>
        <div class="col-md-6 mb-3">
            <input type="text" name="password" class="form-control" placeholder="Password" required>
        </div>
        <button type="submit" class="submit-signup" id="submit-signup">Sign Up</button>
    </form>
    <div class="text-labelled">
        sudah punya akun?
        <a href="#">masuk</a>
    </div>
</div>
